# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Application Name
spring.application.name=codeinsight-backend

# Database Configuration
# Defaults to in-memory H2 (with MySQL mode) so deployment succeeds immediately out-of-the-box on Render.
# To use an external MySQL database, set DB_URL, DB_USERNAME, and DB_PASSWORD in Render Environment.
spring.datasource.url=${DB_URL:jdbc:h2:mem:codeinsight_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.codeinsight=INFO
logging.level.org.springframework.web=INFO
